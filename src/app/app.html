<main class="main">
  
  <div class="content">

    <div style="text-align:center">  
      <h1>Angular 20 + Ethers.js</h1>
      <h2>Template de aplicación DApp</h2>
      <hr/>
      <br/> 
      @if (web3.account()) {  
      <p>Cuenta conectada: <b>{{ web3.account() }}</b></p>  
      } @else {  
      <button (click)="web3.connectWallet()">Conectar Wallet</button>
      }  
    </div>

  </div>
</main>

<router-outlet />
